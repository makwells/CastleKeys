<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link href="./css/style.css" type="stylesheet"> -->
    <title>Password Manager</title>
</head>
<style>
    body{
            background-color: #191919;
            color: #ffffff;
        }
        .Header {
             font-size: 16pt; 
             width: auto;
             height: 60pt;
             color: #ffffff;
             background-color: #111111;
             text-align: left;
             padding-left: 10pt;
             padding-top: 1pt;
             border-bottom: 2px solid #ffffff;
             border-radius: 5pt;
             
        }

        .menu_btn{
            background-color: #111111;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 5pt;
            font-size: 20px;
            height: 50pt;
            width: 100pt;
            transition: all 0.3s ease;
            margin-top: 5pt;
        }
        
        .menu_btn:hover{
            background-color: #555555;
        }

        .menu_btn:active{
            background-color: #292929;
        }
        
        table { 
            margin-top: 5pt;
            width: 100%;
            border-collapse: collapse; 
            
        }
        th, td {
            border: 1px solid #ffffff;
            border-radius: 5pt;
            padding: 8px; 
            text-align: left; 
            font-size: 16pt;
        }
        th {
            background-color: #111111; 
            color: #ffffff;
        }
</style>
<body>
    <div class="Header">
        <h1 id="Header-title">Password Manager</h1>
    </div>
    <div class="Menu">
        <button class="menu_btn" id="home_btn">Home</button>
        <button class="menu_btn" id="settings_btn">Settings</button>
        <button class="menu_btn" id="account_btn">Account</button>  
    </div>
<div>

    <!-- Таблица с паролями -->
    <table>
    <!-- <caption>Passwords</caption> -->
    <thead>
        <tr>
        <th><b>Variable</b></th>
        <th><b>Value</b></th>
        </tr>
    </thead>
    <tbody>
        <tr>
        <td>Google</td>
        <td>hkjasdhfkas</td>
        </tr>
    </tbody>
    </table>
</div>

</body>
</html>
