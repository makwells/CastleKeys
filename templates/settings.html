<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manager</title>
    <style>
        body{
            background-color: #191919;
            color: #ffffff;
        }

        .Header{
            font-size: 16pt; 
            width: auto;
            height: 60pt;
            color: #ffffff;
            background-color: #111111;
            /* text-align: left; */
            padding-left: 10pt;
            padding-top: 1pt;
            border-bottom: 2px solid #ffffff;
            border-radius: 5pt;
        }

        .menu_btn{
            background-color: #111111;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 5pt;
            font-size: 20px;
            height: 50pt;
            width: 100pt;
            transition: all 0.3s ease;
            margin-top: 5pt;
        }
        
        .menu_btn:hover{
            background-color: #555555;
        }

        .menu_btn:active{
            background-color: #292929;
        }

/* #89c8ff */
        .find_parameter{
            background-color: #111111;
            color: #ffffff;
            border: 2px solid #fff;
            border-radius: 5px;
            width: 60%;
            height: 30pt;
            font-size: 20px;
            margin-top: 5pt;
            margin-left: 20%;
            margin-right: 20%;
            transition: all 0.3s ease;
        }
        .find_parameter:hover{
            border: 2px solid #0088ff;
        }
        .find_parameter:active{
            border: 2px solid #0088ff;
        }

        .find_parameter:placeholder-shown{
            color: #444
        }
    </style>
</head>
<body>
    <div class="Header">
        <h1 align="center"><b>Settings</b></h1>
    </div>

    <div class="Menu">
        <button class="menu_btn" id="home_btn">Home</button>
        <button class="menu_btn" id="settings_btn">Settings</button>
        <button class="menu_btn" id="account_btn">Account</button>  

    </div>

        <form>
        <!-- <label for="name">Enter name and surname</label> -->
        <input class="find_parameter" type="text" id="name" placeholder="Find parameter:">
    </form>
    
</body>
</html>
